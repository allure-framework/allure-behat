name: Build

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - 'master'
      - 'hotfix-*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ["7.4", "8.1", "8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@2.35.4
        with:
          php-version: "${{ matrix.php-version }}"

      - uses: actions/setup-node@v6
        with:
          node-version: '20.x'

      - name: Normalize ALLURE_MATRIX_ENV
        run: |
          raw_value="${{ matrix.os }}-php-${{ matrix.php-version }}"
          value="$raw_value"
          value="${value//./_}"
          value="${value//\*/x}"
          echo "ALLURE_MATRIX_ENV=${value}" >> "$GITHUB_ENV"
          echo "ALLURE_TEST_DUMP_NAME=allure-results-${value}" >> "$GITHUB_ENV"

      - name: Install
        run: composer update

      - name: Test
        run: |
          npx -y allure@3 run --config ./allurerc.mjs --rerun 2 --environment="${{ env.ALLURE_MATRIX_ENV }}" --dump="${{ env.ALLURE_TEST_DUMP_NAME }}" -- \
          composer test

      - name: Upload report dump
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ALLURE_TEST_DUMP_NAME }}
          path: ./${{ env.ALLURE_TEST_DUMP_NAME }}.zip
          retention-days: 1

  report:
    needs: [test]
    name: Build Allure report
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
      pull-requests: write
      checks: write
    env:
      ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
      ALLURE_ENDPOINT: ${{ secrets.ALLURE_ENDPOINT }}
      ALLURE_PROJECT_ID: ${{ secrets.ALLURE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20.x'

      - name: Download Allure dumps
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: allure-results-*
          path: ./
          merge-multiple: true

      - name: Generate Allure report
        run: npx -y allure@3 generate --config ./allurerc.mjs --dump="allure-results-*.zip" --output=./out/allure-report

      - name: Post Allure summary
        if: ${{ always() && !cancelled() && contains(fromJSON('["success","failure"]'), needs.test.result) }}
        uses: allure-framework/allure-action@v0
        with:
          report-directory: ./out/allure-report
